<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <title id="t">Headroom, drawn as an Elliott wave</title>
  <desc id="d">A five-wave impulse on a log scale of people per room. Start: a one-to-one call, 2 people. Wave 1 peaks at a conference, a few dozen people. Wave 3 peaks at 2,000 viewers of real H.264 video, tested. Wave 5 peaks at 6,000 viewers of a 30 fps stream on one 4-vCPU relay, tested with zero loss. A dashed line continues to 1 million viewers, not yet tested.</desc>
  <defs>
    <linearGradient id="wave" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#46536a"/>
      <stop offset="0.45" stop-color="#38d6f5"/>
      <stop offset="1" stop-color="#9ef0ff"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#38d6f5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38d6f5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="400" rx="22" fill="#0b1220"/>
  <text x="40" y="50" fill="#e6edf7" font-size="20" font-weight="600">Headroom</text>
  <text x="40" y="74" fill="#8a97ab" font-size="14">People per room, log scale. One 4-vCPU relay, zero loss.</text>

  <!-- y = 300 - 36.7 * log10(n) -->
  <g stroke="#1f2a3d" stroke-width="1">
    <line x1="90" y1="300" x2="920" y2="300"/><line x1="90" y1="226.6" x2="920" y2="226.6"/>
    <line x1="90" y1="153.1" x2="920" y2="153.1"/><line x1="90" y1="79.8" x2="920" y2="79.8"/>
  </g>
  <g fill="#5d6a80" font-size="12" text-anchor="end">
    <text x="80" y="304">1</text><text x="80" y="230">100</text><text x="80" y="157">10K</text><text x="80" y="84">1M</text>
  </g>

  <path d="M120 289 L220 243 L290 267 L470 179 L540 196 L640 161 L640 300 L120 300 Z" fill="url(#fill)"/>
  <path d="M120 289 L220 243 L290 267 L470 179 L540 196 L640 161" fill="none" stroke="url(#wave)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M640 161 L700 176 L900 80" fill="none" stroke="#46536a" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="220" cy="243" r="11" fill="#0b1220" stroke="#38d6f5" stroke-width="2"/><text x="220" y="247" fill="#38d6f5">1</text>
    <circle cx="290" cy="267" r="11" fill="#0b1220" stroke="#46536a" stroke-width="2"/><text x="290" y="271" fill="#8a97ab">2</text>
    <circle cx="470" cy="179" r="11" fill="#0b1220" stroke="#38d6f5" stroke-width="2"/><text x="470" y="183" fill="#38d6f5">3</text>
    <circle cx="540" cy="196" r="11" fill="#0b1220" stroke="#46536a" stroke-width="2"/><text x="540" y="200" fill="#8a97ab">4</text>
    <circle cx="640" cy="161" r="11" fill="#0b1220" stroke="#9ef0ff" stroke-width="2"/><text x="640" y="165" fill="#9ef0ff">5</text>
  </g>

  <g font-size="13">
    <circle cx="120" cy="289" r="5" fill="#8a97ab"/>
    <text x="110" y="276" fill="#c4cedc" text-anchor="middle">1:1 call, 2</text>
    <text x="220" y="222" fill="#c4cedc" text-anchor="middle">Conference, a few dozen</text>
    <text x="470" y="158" fill="#38d6f5" text-anchor="middle" font-weight="600">2,000 real video, tested</text>
    <text x="650" y="138" fill="#9ef0ff" text-anchor="middle" font-weight="600">6,000, tested</text>
    <text x="900" y="66" fill="#8a97ab" text-anchor="end">1M: next. Not yet tested.</text>
  </g>

  <text x="40" y="372" fill="#8a97ab" font-size="12">Peaks are real room sizes and measured runs. The dips are there because it's an Elliott wave.</text>
</svg>
